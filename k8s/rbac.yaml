apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegismind-sre-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegismind-sre-clusterrole
rules:
  - apiGroups: ["", "apps", "autoscaling", "networking.k8s.io"]
    resources:
      - deployments
      - deployments/scale
      - pods
      - pods/log
      - pods/status
      - services
      - configmaps
      - secrets
      - events
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegismind-sre-binding
subjects:
  - kind: ServiceAccount
    name: aegismind-sre-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: aegismind-sre-clusterrole
  apiGroup: rbac.authorization.k8s.io
