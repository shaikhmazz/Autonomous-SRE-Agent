apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway-service
  namespace: production
  labels:
    app: payment-gateway-service
    tier: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway-service
  template:
    metadata:
      labels:
        app: payment-gateway-service
    spec:
      containers:
        - name: payment-api
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway-service
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: payment-gateway-service
